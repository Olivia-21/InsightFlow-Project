spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/insight-flow
    username: postgres
    password: noah@123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create   # Recreates schema on each startup (for development only)
    defer-datasource-initialization: true # Run scripts AFTER Hibernate creates tables
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  sql:
    init:
      mode: always   # Enabled to seed data into the Docker volume
      data-locations: classpath:scripts/seed-data.sql

server:
  port: 8080

app:
  jwt:
    secret: Y2hhbmdlLXRoaXMtaW4tcHJvZHVjdGlvbi1pbnNpZ2h0Zmxvdy1zZWNyZXQta2V5LTEyMzQ1Njc4OQ==
    expiration-ms: 86400000
  upload:
    directory: ./uploads

minio:
  url: ${MINIO_URL:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:insightflow-exports}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
